# Hourly ping so the Neon database and the Vercel deployment get regular traffic.
# Vercel's Hobby plan only allows daily cron jobs, so this runs on GitHub Actions instead.
name: keep-alive

on:
  schedule:
    - cron: "0 * * * *" # every hour, on the hour (UTC)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health
        run: |
          curl -fsS --max-time 30 --retry 2 --retry-delay 10 https://oauth-runway-blush.vercel.app/api/health
