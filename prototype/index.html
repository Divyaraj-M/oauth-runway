  {n:2, key:"review",  name:"Review to list", desc:"Works right away. Review only if you want a public listing."},
  {n:3, key:"audit",   name:"Security audit", desc:"Verification, plus a paid third-party assessment for some permissions."},
  {n:4, key:"partner", name:"Partner-gated",  desc:"A person at the provider must approve you and create the app."}
];
const levelOf = k => (LEVELS.find(l => l.key === k) || LEVELS[1]);
const EVL = {tested:"Tested", sourced:"Sourced", uncertain:"Unverified"};
const EVC = {tested:"border-l1/30 bg-l1/10 text-l1", sourced:"border-l2/30 bg-l2/10 text-l2", uncertain:"border-l3/30 bg-l3/10 text-l3"};
const WHO = {agent:"Agent", you:"You", provider:"Provider"};
const WHOC = {agent:"bg-primary text-primary-foreground border-transparent", you:"bg-secondary text-secondary-foreground border-transparent", provider:"text-foreground"};
const CHECKED = "2026-10-20";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => { const [y,m,dd] = d.split("-").map(Number); return `${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].at(m-1)} ${dd}, ${y}`; };
const ev = e => { const k = EVL[e] ? e : "uncertain"; return `<span class="${badge} ${EVC[k]}">${EVL[k]}</span>`; };
const meter = (n, h = "h-1.5") => `<div class="flex w-full gap-1" role="img" aria-label="Difficulty level ${n} of 4">${[1,2,3,4].map(i => `<span class="${h} flex-1 rounded-full ${i <= n ? `bg-l${n}` : "bg-muted"}"></span>`).join("")}</div>`;
const levelBadge = n => `<span class="${badge} border-l${n}/30 bg-l${n}/10 text-l${n}">Level ${n} · ${LEVELS.at(n-1).name}</span>`;
const freshness = g => g._generated
  ? `<span class="${badge} text-muted-foreground">${icon("clock","size-3")}Generated just now</span>`
  : `<span class="tip ${badge} text-muted-foreground" tabindex="0">${icon("refresh","size-3")}Last updated ${fmtDate(g.checked || CHECKED)}<span class="tip-c rounded-md bg-primary px-3 py-1.5 text-xs font-normal text-primary-foreground">Updated by hand on this date. A weekly re-crawl of provider docs is specified but not running in this prototype.</span></span>`;

const view = document.getElementById("view");
document.getElementById("logo").innerHTML = icon("key","size-3.5");
let generated = null;
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const stagger = (els, max = 10) => [...els].slice(0, max).forEach((el, i) => { el.classList.remove("enter"); el.style.setProperty("--i", i); void el.offsetWidth; el.classList.add("enter"); });
const openLayer = (...els) => requestAnimationFrame(() => requestAnimationFrame(() => els.forEach(e => e && e.setAttribute("data-open", ""))));
const closeLayer = (root, els, ms) => { els.forEach(e => { if (e) { e.removeAttribute("data-open"); e.setAttribute("data-closing", ""); } }); setTimeout(() => { root.innerHTML = ""; }, RM.matches ? 0 : ms); };
const chats = {};

/* ---------- catalog: every app we list; only LIB entries have a reviewed guide ---------- */
const CATALOG = [
  {key:"gmail", app:"Gmail", provider:"Google", cat:"Email"},
  {key:"aircall", app:"Aircall", provider:"Aircall", cat:"Calling"},
  {key:"slack", app:"Slack", provider:"Slack", cat:"Messaging"},
  {key:"notion", app:"Notion", provider:"Notion", cat:"Docs"},
  {key:"linear", app:"Linear", provider:"Linear", cat:"Issue tracking"},
  {key:"jira", app:"Jira", provider:"Atlassian", cat:"Issue tracking"},
  {key:"confluence", app:"Confluence", provider:"Atlassian", cat:"Docs"},
  {key:"github", app:"GitHub", provider:"GitHub", cat:"Code"},
  {key:"hubspot", app:"HubSpot", provider:"HubSpot", cat:"CRM"},
  {key:"salesforce", app:"Salesforce", provider:"Salesforce", cat:"CRM"},
  {key:"zoom", app:"Zoom", provider:"Zoom", cat:"Meetings"},
  {key:"calendly", app:"Calendly", provider:"Calendly", cat:"Scheduling"},
  {key:"googlecalendar", app:"Google Calendar", provider:"Google", cat:"Calendar"},
  {key:"googledrive", app:"Google Drive", provider:"Google", cat:"Files"},
  {key:"outlook", app:"Outlook", provider:"Microsoft", cat:"Email"},
  {key:"teams", app:"Microsoft Teams", provider:"Microsoft", cat:"Messaging"},
  {key:"asana", app:"Asana", provider:"Asana", cat:"Projects"},
  {key:"zendesk", app:"Zendesk", provider:"Zendesk", cat:"Support"},
  {key:"dropbox", app:"Dropbox", provider:"Dropbox", cat:"Files"},
  {key:"airtable", app:"Airtable", provider:"Airtable", cat:"Database"}
];
let libFilter = 0, libQuery = "", showAll = false;
const tile = name => `<span class="grid size-9 shrink-0 place-items-center rounded-md border bg-muted text-sm font-semibold text-foreground" aria-hidden="true">${esc(name.split(/\s+/).map(w => w[0]).join("").slice(0,2).toUpperCase())}</span>`;

function renderList(reveal = false){
  const list = document.getElementById("lib-list"); if (!list) return;
  const q = libQuery.toLowerCase();
  const matches = CATALOG.filter(c => {
    const g = LIB[c.key];
    if (q && !`${c.app} ${c.provider} ${c.cat}`.toLowerCase().includes(q)) return false;
    if (!libFilter) return true;
    if (libFilter === 5) return !g;
    return g && levelOf(g.difficulty).n === libFilter;
  });
  const collapsed = !showAll && !q && !libFilter;
  const rows = collapsed ? matches.filter(c => LIB[c.key]) : matches;
  list.innerHTML = rows.map(c => {
    const g = LIB[c.key];
    if (g) { const l = levelOf(g.difficulty); return `
      <li><button type="button" data-key="${c.key}" class="lib flex w-full min-w-0 items-start gap-4 p-4 text-left transition-colors hover:bg-accent/50 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-inset focus-visible:ring-ring sm:items-center">
        ${tile(c.app)}
        <div class="flex min-w-0 flex-1 flex-col gap-2 sm:flex-row sm:items-center sm:gap-5">
          <div class="flex shrink-0 flex-col gap-1.5 sm:w-48">
            <span class="flex items-baseline gap-2"><span class="font-semibold tracking-tight">${esc(c.app)}</span><span class="text-xs text-muted-foreground">${esc(c.cat)}</span></span>
            <div class="flex items-center gap-2"><div class="w-14 shrink-0">${meter(l.n)}</div><span class="text-xs font-medium text-l${l.n}">Level ${l.n} · ${l.name}</span></div>
          </div>
          <div class="flex min-w-0 flex-1 flex-col gap-1">
            <p class="text-sm text-muted-foreground">${esc(g.verdict.split(". ")[0])}.</p>
            <div class="tnum flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-muted-foreground">
              <span class="inline-flex items-center gap-1.5">${icon("clock","size-3.5")}Work ${esc(g.hands_on.text)} · Wait ${esc(g.waiting.normal)}</span>
              <span>Last updated ${fmtDate(g.checked || CHECKED)}</span>
            </div>
          </div>
        </div>
        <span class="hidden self-center text-muted-foreground sm:block">${icon("slash")}</span>
      </button></li>`; }
    return `
      <li class="unrated flex items-start gap-4 p-4 sm:items-center">
        ${tile(c.app)}
        <div class="flex min-w-0 flex-1 flex-col gap-2 sm:flex-row sm:items-center sm:gap-5">
          <div class="flex shrink-0 flex-col gap-1.5 sm:w-48">
            <span class="flex items-baseline gap-2"><span class="font-semibold tracking-tight">${esc(c.app)}</span><span class="text-xs text-muted-foreground">${esc(c.cat)}</span></span>
            <div class="flex items-center gap-2"><div class="w-14 shrink-0"><div class="flex w-full gap-1">${[1,2,3,4].map(() => `<span class="h-1.5 flex-1 rounded-full bg-muted"></span>`).join("")}</div></div><span class="text-xs font-medium text-muted-foreground">Not rated yet</span></div>
          </div>
          <p class="min-w-0 flex-1 text-sm text-muted-foreground">No reviewed guide yet. The agent can write a live draft${c.provider !== c.app ? ` (provider: ${esc(c.provider)})` : ""}.</p>
        </div>
        <button type="button" data-gen="${esc(c.app)}" class="gen-row ${B.base} ${B.outlineSm} shrink-0 self-center">Generate guide</button>
      </li>`;
  }).join("") || `<li class="flex flex-col items-center gap-2 p-10 text-center"><span class="font-medium">No apps match</span><span class="text-sm text-muted-foreground">Describe the app in the search box at the top and the agent writes a guide.</span></li>`;
  if (reveal) stagger(list.querySelectorAll("li.unrated"), 20);
  list.querySelectorAll(".lib").forEach(b => b.onclick = () => { location.hash = b.dataset.key; });
  list.querySelectorAll(".gen-row").forEach(b => b.onclick = () => {
    const i = document.getElementById("g-q");
    i.value = `${b.dataset.gen}: what does it take to get a production OAuth app approved for my customers?`;
    window.scrollTo(0, 0);
    document.getElementById("gen-form").requestSubmit();
  });
  const n = document.getElementById("lib-count");
  if (n) n.textContent = `${rows.length} of ${CATALOG.length} apps · ${Object.keys(LIB).length} reviewed`;
  const more = document.getElementById("show-all");
  if (more) {
    const hidden = matches.length - rows.length;
    more.hidden = !(collapsed ? hidden > 0 : (showAll && !q && !libFilter));
    more.innerHTML = collapsed ? `Show all ${CATALOG.length} apps ${icon("chev","size-3.5")}` : `Show reviewed only ${icon("chev","size-3.5 rotate-180")}`;
  }
}

  view.innerHTML = `

      <div class="relative w-full sm:max-w-xs">

        <label for="lib-q" class="sr-only">Filter apps</label>
        <input id="lib-q" autocomplete="off" value="${esc(libQuery)}" placeholder="Filter apps…" class="flex h-9 w-full rounded-md border border-input bg-transparent pl-9 pr-3 py-1 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">
      </div>
      <div class="overflow-x-auto"><div role="tablist" class="inline-flex h-9 items-center rounded-lg bg-muted p-1 text-muted-foreground">
        ${[[0,"All"],[1,"L1"],[2,"L2"],[3,"L3"],[4,"L4"],[5,"Not rated"]].map(([n,t]) => `<button role="tab" type="button" data-f="${n}" data-state="${libFilter===n?"active":"inactive"}" aria-selected="${libFilter===n}" ${n>=1&&n<=4?`title="Level ${n} · ${LEVELS.at(n-1).name}"`:""} class="inline-flex h-7 items-center whitespace-nowrap rounded-md px-3 text-sm font-medium transition-all focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring data-[state=active]:bg-background data-[state=active]:text-foreground data-[state=active]:shadow">${t}</button>`).join("")}
      </div></div>
    </div>
    <ul id="lib-list" class="${card} divide-y overflow-hidden"></ul>
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

      </div>
      <p id="lib-count" class="tnum text-xs text-muted-foreground"></p>
    </div>
  </section>`;
  view.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
    libFilter = Number(b.dataset.f);

/* ---------- dialog: start a guide for an unlisted app ---------- */
function openNewApp(){
  const root = document.getElementById("sheet-root");
  root.innerHTML = `
  <div id="dlg-overlay" class="overlay fixed inset-0 z-50 bg-black/60"></div>
  <div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" class="dlg fixed left-1/2 top-1/2 z-50 grid w-[calc(100%-32px)] max-w-lg gap-4 rounded-xl border bg-background p-6 shadow-lg">
    <div class="flex flex-col gap-1.5">
      <h2 id="dlg-title" class="text-lg font-semibold leading-none tracking-tight">Start a guide for an app not listed</h2>
      <p class="text-sm text-muted-foreground">The agent researches the app and writes a live draft. Every line is marked Unverified until a person reviews it.</p>
    </div>
    <form id="dlg-form" class="grid gap-4">
      <div class="grid gap-2"><label for="dlg-app" class="text-sm font-medium leading-none">App name or website</label>
        <input id="dlg-app" required autocomplete="off" placeholder="Pipedrive, intercom.com…" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"></div>
      <div class="grid gap-2"><label for="dlg-do" class="text-sm font-medium leading-none">What your agent should do in it</label>
        <textarea id="dlg-do" rows="2" placeholder="Read deals and update their stage" class="flex min-h-[60px] w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"></textarea></div>
      <div class="grid gap-2"><label for="dlg-who" class="text-sm font-medium leading-none">Who connects it</label>
        <select id="dlg-who" class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">
          <option value="for my customers">My customers (public app)</option>
          <option value="for my own company only">Only my company (internal)</option>
        </select></div>
      <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
        <button type="button" id="dlg-cancel" class="${B.base} ${B.outline}">Cancel</button>
        <button type="submit" class="${B.base} ${B.primary}">Start guide ${icon("arrow")}</button>
      </div>
    </form>
    <button type="button" id="dlg-x" class="${B.base} ${B.iconBtn} absolute right-3 top-3" aria-label="Close">${icon("x")}</button>
  </div>`;
  const dov = document.getElementById("dlg-overlay"), dlg = document.getElementById("dlg");
  openLayer(dov, dlg);
  const close = () => { document.removeEventListener("keydown", onKey); closeLayer(root, [dov, dlg], 150); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  ["dlg-overlay","dlg-cancel","dlg-x"].forEach(id => document.getElementById(id).onclick = close);
  document.getElementById("dlg-form").onsubmit = e => {
    e.preventDefault();
    const app = document.getElementById("dlg-app").value.trim();
    const what = document.getElementById("dlg-do").value.trim();
    const who = document.getElementById("dlg-who").value;
    if (!app) return;
    close();
    document.getElementById("g-q").value = `${app}: ${what || "typical read and write access"}, ${who}`;
    window.scrollTo(0, 0);
    document.getElementById("gen-form").requestSubmit();
  };
  document.getElementById("dlg-app").focus();
}

/* ---------- guide ---------- */

  view.innerHTML = `
  <nav aria-label="Breadcrumb" class="flex items-center gap-1.5 text-sm text-muted-foreground">

  <header class="flex flex-col gap-3 pt-4">

function toMarkdown(g){
  const l = levelOf(g.difficulty), L = [];
  L.push(`# ${g.app} OAuth app — setup & approval`);
  if (g._generated) L.push(`> Live draft from the agent. Unverified.`);
  L.push(`**Difficulty:** Level ${l.n} of 4 · ${l.name}`, ``, g.verdict, ``);
  L.push(`**Your work:** ${g.hands_on.text}  `, `**Waiting:** best ${g.waiting.best} · normal ${g.waiting.normal} · worst ${g.waiting.worst}`, ``);
  L.push(`**Start now:** ${g.start_now}`, ``, `## Your case`);
  (g.cases||[]).forEach(c => L.push(`- ${c.case} → ${c.outcome} _(${EVL[c.ev]||"Unverified"})_`));
  L.push(``, `## Steps`);
  (g.steps||[]).forEach((s,i) => L.push(`${i+1}. **[${WHO[s.who]||"You"}] ${s.title}** — ${s.detail} _(${EVL[s.ev]||"Unverified"})_`));
  L.push(``, `## Blockers`); (g.blockers||[]).forEach(b => L.push(`- ${b.text} _(${EVL[b.ev]||"Unverified"})_`));
  L.push(``, `## Agent can do`); (g.agent_can||[]).forEach(x=>L.push(`- ${x}`));
  L.push(``, `## You must do`); (g.you_must||[]).forEach(x=>L.push(`- ${x}`));
  L.push(``, `## Not confirmed`); (g.unverified||[]).forEach(x=>L.push(`- ${x}`));
  L.push(``, `## Sources`); (g.sources||[]).forEach(s=>L.push(`- ${s.u ? `[${s.t}](${s.u})` : s.t}`));
  return L.join("\n");
}

async function copy(text, msg){

}
function setFab(fn){

/* ---------- agent chat (Sheet + Message + Trace) ---------- */
const SECRET = /(sk-[A-Za-z0-9_\-]{12,}|ghp_[A-Za-z0-9]{20,}|xox[abpr]-[A-Za-z0-9\-]{10,}|AIza[0-9A-Za-z_\-]{30,}|GOCSPX-[A-Za-z0-9_\-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY|client[_ ]?secret\s*[:=]\s*\S{8,}|\b[A-Za-z0-9_\-]{40,}\b)/i;

function openChat(g, key, prefill = ""){
  const root = document.getElementById("sheet-root");
  const hist = chats[key] = chats[key] || [];
  root.innerHTML = `
  <div id="sheet-overlay" class="overlay fixed inset-0 z-50 bg-black/60"></div>
  <aside id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" class="sheet fixed inset-y-0 right-0 z-50 flex w-full flex-col border-l bg-background shadow-lg sm:max-w-md"
    style="padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)">
    <div class="flex items-start justify-between gap-4 border-b p-5">
      <div class="flex flex-col gap-1">
        <h2 id="sheet-title" class="flex items-center gap-2 text-lg font-semibold tracking-tight">${icon("bot")}Integration agent</h2>
        <p class="text-sm text-muted-foreground">Ask about ${esc(g.app)} while you set it up. It answers from this guide and says when it isn't sure.</p>
      </div>
      <button type="button" id="sheet-close" class="${B.base} ${B.iconBtn}" aria-label="Close">${icon("x")}</button>
    </div>
    <div id="msgs" class="flex flex-1 flex-col gap-5 overflow-y-auto p-5"></div>
    <form id="chat-form" class="flex flex-col gap-2 border-t p-4">
      <div id="chat-warn"></div>
      <div class="flex items-end gap-2">
        <label for="chat-q" class="sr-only">Message the agent</label>
        <textarea id="chat-q" rows="2" class="flex min-h-[60px] w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" placeholder="Ask about a step, a scope, a blocker…"></textarea>
        <button type="submit" id="chat-send" class="${B.base} bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 w-9" aria-label="Send">${icon("send")}</button>
      </div>
      <p class="flex items-center gap-1.5 text-xs text-muted-foreground">${icon("shield","size-3")}Never paste secrets. Anything that looks like a key is blocked.</p>
    </form>
  </aside>`;
  const ov = document.getElementById("sheet-overlay"), sh = document.getElementById("sheet");
  openLayer(ov, sh);
  const close = () => { document.removeEventListener("keydown", onKey); closeLayer(root, [ov, sh], 210); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  ov.onclick = close;
  document.getElementById("sheet-close").onclick = close;
  const ta = document.getElementById("chat-q");
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("chat-form").requestSubmit(); } });
  document.getElementById("chat-form").onsubmit = e => { e.preventDefault(); sendChat(g, key, ta.value); };
  seen[key] = hist.length;
  paintMsgs(g, key);
  if (prefill) { ta.value = prefill; }
  ta.focus();
}

const seen = {};
function paintMsgs(g, key){
  const box = document.getElementById("msgs"); if (!box) return;
  const hist = chats[key];
  const from = seen[key] ?? hist.length;
  if (!hist.length) {
    const ideas = [
      g.blockers?.[0] ? "Which blocker is most likely to hit me?" : "What usually blocks approval?",
      "What can I do this week to shorten the wait?",
      "What if this is only for my own company?"
    ];
    box.innerHTML = `<div class="m-auto flex max-w-xs flex-col items-center gap-3 text-center">
      <span class="grid size-10 place-items-center rounded-lg border bg-muted">${icon("bot","size-5")}</span>
      <div class="flex flex-col gap-1"><span class="font-medium">Stuck on ${esc(g.app)}?</span><span class="text-sm text-muted-foreground">Ask about any step. The agent knows this guide and your progress in it.</span></div>
      <div class="flex w-full flex-col gap-2">${ideas.map(q => `<button type="button" class="idea ${B.base} ${B.outlineSm} h-auto whitespace-normal py-2 text-left">${esc(q)}</button>`).join("")}</div>
    </div>`;
    box.querySelectorAll(".idea").forEach(b => b.onclick = () => sendChat(g, key, b.textContent));
    stagger(box.firstElementChild.children);
    return;
  }
  box.innerHTML = hist.map((m, i) => m.role === "user"
    ? `<div class="${i >= from ? "enter " : ""}flex justify-end"><div class="max-w-[85%] whitespace-pre-wrap rounded-lg bg-primary px-3 py-2 text-sm text-primary-foreground">${esc(m.content)}</div></div>`
    : `<div class="${i >= from ? "enter " : ""}flex gap-3"><span class="grid size-7 shrink-0 place-items-center rounded-full border bg-muted">${icon("bot","size-3.5")}</span>
        <div class="flex min-w-0 flex-1 flex-col gap-2">
          ${trace(m.trace, m.pending)}
          <div class="whitespace-pre-wrap text-sm ${m.error ? "text-destructive" : ""}" data-msg="${i}">${m.content ? esc(m.content) : (m.pending ? `<span class="inline-flex items-center gap-2 text-muted-foreground">${icon("loader","size-3.5 spin")}Thinking…</span>` : "")}</div>
        </div></div>`).join("");
  box.scrollTop = box.scrollHeight;
  seen[key] = hist.length;
}

function trace(steps = [], pending){
  if (!steps.length) return "";
  return `<details class="rounded-md border text-xs" ${pending ? "open" : ""}>
    <summary class="flex cursor-pointer items-center gap-2 px-3 py-2 text-muted-foreground hover:text-foreground">${pending ? icon("loader","size-3.5 spin") : icon("check","size-3.5 text-l1")}<span class="flex-1">${pending ? "Researching" : `Researched · ${steps.length} steps`}</span><span class="chev transition-transform">${icon("chev","size-3.5")}</span></summary>
    <ol class="flex flex-col gap-1.5 border-t px-3 py-2">${steps.map(s => `<li class="flex items-start gap-2 ${s.done ? "text-foreground" : "text-muted-foreground"}">${s.done ? icon("check","size-3.5 mt-px text-l1") : icon("loader","size-3.5 mt-px spin")}<span>${esc(s.t)}</span></li>`).join("")}</ol>
  </details>`;
}

async function sendChat(g, key, text){
  const q = String(text || "").trim();
  const warn = document.getElementById("chat-warn");
  if (!q) return;
  if (SECRET.test(q)) {
    warn.innerHTML = `<div role="alert" class="${alertBox} border-destructive/50 text-destructive">${icon("alert","size-4 mt-0.5")}<div class="font-medium leading-none">Not sent: this looks like a credential</div><div class="col-start-2 text-xs opacity-90">Remove the key or secret and ask again. The agent never needs it.</div></div>`;
    return;
  }
  warn.innerHTML = "";
  document.getElementById("chat-q").value = "";
  const hist = chats[key];
  hist.push({role:"user", content:q});
  const steps = [
    {t:`Read the ${g.app} guide: ${(g.steps||[]).length} steps, ${(g.blockers||[]).length} blockers`, done:false},
    {t:`Checked the ${(g.sources||[]).length} sources the guide cites`, done:false},
    {t:"Drafted an answer (model knowledge, no live web search)", done:false}
  ];
  const reply = {role:"assistant", content:"", trace:steps, pending:true};
  hist.push(reply);
  paintMsgs(g, key);
  const tick = setInterval(() => { const n = steps.find(s => !s.done); if (n && n !== steps.at(-1)) { n.done = true; paintMsgs(g, key); } }, 700);
  const send = document.getElementById("chat-send"); if (send) send.disabled = true;
  try {
    const sample = await claude.use("sample");
    if (!sample) throw {message:"The agent isn't available in this view. Open the page in claude.ai while signed in."};
    const ctx = `You are an integration agent helping a developer set up and get approval for their ${g.app} OAuth app, for an AI agent product.
Guide (JSON; evidence labels: tested = done first-hand, sourced = in a linked source, uncertain = not confirmed):
${JSON.stringify({...g, _generated: undefined})}

Rules: answer in plain language, 2-6 short sentences, no headings. If the answer changes the difficulty level, work time or waiting time, say so. If the guide doesn't cover it, say that and give your best understanding starting with "Not verified:". Never claim something was tested unless the guide marks it tested. Never ask for or accept client secrets, tokens or passwords; if asked, tell them not to share it.`;
    const msgs = [];
    for (const m of hist) {
      if (m.pending) continue;
      if (m.error) { if (msgs.at(-1)?.role === "user") msgs.pop(); continue; }
      msgs.push({role:m.role, content:m.content});
    }
    if (msgs[0]) msgs[0] = {role:"user", content:`${ctx}\n\nQuestion: ${msgs[0].content}`};
    const res = await sample(msgs, { cache:false, onText: ({text}) => { reply.content = text; const el = document.querySelector(`[data-msg="${hist.indexOf(reply)}"]`); if (el) el.textContent = text; } });
    reply.content = res.text;
  } catch (err) {
    reply.error = true;
    reply.content = err && err.code === "not_granted" ? "Permission to ask Claude was declined, so the agent can't answer here."
      : err && err.code === "rate_limited" ? "Too many requests right now. Wait a minute and ask again."
      : (err && err.message) || "Something went wrong. Ask again.";
  } finally {
    clearInterval(tick); steps.forEach(s => s.done = true); reply.pending = false;
    if (send) send.disabled = false;
    paintMsgs(g, key);
  }
}

/* ---------- live guide generation ---------- */
const PROMPT = q => `You are an OAuth setup analyst. A developer building an AI agent wrote:
"""${q}"""
Identify the app their users will connect, what the agent must do in it, and whether it is for their own company only or for their customers (assume customers if not said).

Write a setup-and-approval guide for creating that app's OAuth app and getting it approved for production.
Start the verdict with your reading of their case (e.g. "For a public app that reads meetings, ...").
Focus on what docs hide: hands-on time vs waiting time, review gates, scopes that trigger review, partner programs, paid-plan requirements, domain or policy requirements, and paths that avoid review.

Difficulty levels: "self" = credentials in minutes, no review for the common case; "review" = works now, review only to list publicly; "audit" = verification plus a third-party security assessment for some permissions; "partner" = a person at the provider must approve and create the app.

Evidence rules, strictly:
- "sourced" only if you can name a specific official page URL you are confident exists. Put it in sources.
- Otherwise "uncertain". Never use "tested".
- If you don't know whether the app supports OAuth at all, say so in the verdict and in unverified.
- Prefer ranges. Never invent precise review durations.

Return ONLY JSON, no prose:
{"app":string,"provider":string,"difficulty":"self"|"review"|"audit"|"partner","verdict":string (2 sentences),
"hands_on":{"text":string,"days":number},"waiting":{"best":string,"normal":string,"worst":string,"days":number},
"start_now":string,
"cases":[{"case":string,"outcome":string,"ev":"sourced"|"uncertain"}] (2-3),
"steps":[{"who":"agent"|"you"|"provider","title":string,"detail":string,"ev":"sourced"|"uncertain"}] (4-7),
"blockers":[{"text":string,"ev":"sourced"|"uncertain"}] (2-5),
"agent_can":[string],"you_must":[string],"unverified":[string],"sources":[{"t":string,"u":string}]}`;

const STAGES = ["Finding the developer portal","Checking how OAuth apps are created","Looking for review and partner gates","Mapping your features to permissions","Estimating work vs waiting","Writing the guide"];

async function onGenerate(e){
  e.preventDefault();
  const q = document.getElementById("g-q").value.trim();
  const status = document.getElementById("g-status");
  const btn = document.getElementById("g-go");
  if (!q) return;
  if (SECRET.test(q)) { status.innerHTML = `<div role="alert" class="${alertBox} border-destructive/50 text-destructive">${icon("alert","size-4 mt-0.5")}<div class="font-medium leading-none">Not sent: this looks like a credential</div><div class="col-start-2 text-xs opacity-90">Describe the app and what your agent does. No keys needed.</div></div>`; return; }
  const words = q.toLowerCase().replace(/https?:\/\//g,"").replace(/www\./g,"").split(/[^a-z0-9]+/);
  const hit = Object.keys(LIB).find(k => words.includes(k));
  if (hit) { location.hash = hit; return; }

  btn.disabled = true;
  let stage = 0, chars = 0;
  status.innerHTML = `<div class="${card} enter flex flex-col gap-4 p-5">
      <div class="flex items-center justify-between gap-3"><span class="font-semibold tracking-tight">Researching</span><span id="gen-chars" class="tnum text-xs text-muted-foreground"></span></div>
      <div class="relative h-1.5 w-full overflow-hidden rounded-full bg-primary/20"><div id="gen-bar" class="bar h-full w-full bg-primary" style="transform:scaleX(0)"></div></div>
      <ol id="gen-steps" class="flex flex-col gap-2 text-sm"></ol>
      <div class="flex flex-col gap-2 pt-1"><div class="h-4 w-2/3 animate-pulse rounded-md bg-primary/10"></div><div class="h-4 w-full animate-pulse rounded-md bg-primary/10"></div><div class="h-4 w-5/6 animate-pulse rounded-md bg-primary/10"></div></div>
    </div>`;
  const paint = () => {
    const bar = document.getElementById("gen-bar"), ol = document.getElementById("gen-steps");
    if (!bar || !ol) return;
    requestAnimationFrame(() => { bar.style.transform = `scaleX(${((stage + 1) / STAGES.length).toFixed(3)})`; });
    ol.innerHTML = STAGES.map((s,i) => `<li class="flex items-center gap-2 transition-opacity duration-200 ${i<stage?"":"text-muted-foreground"} ${i>stage?"opacity-50":""}">${i<stage?`<span class="${i===stage-1?"pop ":""}inline-flex">${icon("check","size-4 text-l1")}</span>`:i===stage?icon("loader","size-4 spin"):`<span class="size-4 rounded-full border"></span>`}${s}</li>`).join("");
  };
  paint();
  const timer = setInterval(() => { if (stage < STAGES.length-1) { stage++; paint(); } }, 2500);
  try {
    const sample = await claude.use("sample");
    if (!sample) throw {message:"Live generation isn't available in this view. Open the page in claude.ai while signed in."};
    const res = await sample(PROMPT(q), { modelTier:"complex", onText: ({text}) => { chars = text.length; const el = document.getElementById("gen-chars"); if (el) el.textContent = `${chars} characters drafted`; } });
    const raw = res.text.replace(/^```(?:json)?\s*/,"").replace(/```\s*$/,"");
    const g = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}")+1));
    g.app = g.app || q; g.provider = g.provider || g.app;
    g.hands_on = g.hands_on || {text:"Unknown", days:0.5};
    g.waiting = g.waiting || {best:"Unknown", normal:"Unknown", worst:"Unknown", days:1};
    ["steps","blockers","cases"].forEach(k => (g[k]||[]).forEach(x => { if (x.ev === "tested") x.ev = "uncertain"; }));
    g._generated = true;
    generated = g;
    clearInterval(timer);
    location.hash = "draft";
    if (location.hash === "#draft") route();
  } catch (err) {
    clearInterval(timer);
    btn.disabled = false;
    const m = err && err.code === "not_granted" ? "Permission to ask Claude was declined, so the agent can't run here."
      : err && err.code === "rate_limited" ? "Too many requests right now. Wait a minute and try again."
      : err instanceof SyntaxError ? "The agent's answer came back malformed. Try again."
      : (err && err.message) || "Something went wrong. Try again.";
    status.innerHTML = `<div role="alert" class="${alertBox} border-destructive/50 text-destructive">${icon("alert","size-4 mt-0.5")}<div class="font-medium leading-none">Couldn't write the guide</div><div class="col-start-2 text-sm opacity-90">${esc(m)}</div></div>`;
  }
}

/* ---------- routing ---------- */
function goHome(){ if (location.hash) location.hash = ""; else renderHome(); }
function route(){
  document.getElementById("sheet-root").innerHTML = "";
  const k = location.hash.replace("#","");
  if (LIB[k]) renderGuide(LIB[k], k);
  else if (k === "draft" && generated) renderGuide(generated, "draft");
  else renderHome();
}
document.getElementById("home-btn").onclick = goHome;
window.addEventListener("hashchange", route);
route();
</script>
